<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file: data:">
<title>PokéIdle Desk</title>
<style>
  :root {
    --bg: #131118; --panel: #1a1721; --card: #221f2b; --card2: #2a2634; --line: #332e40;
    --accent: #7c5cf0; --accent2: #9c84ff; --text: #ece9f5; --dim: #9d98ad; --faint: #6f6a80;
    --ok: #4fd18b; --warn: #f0b429; --bad: #f0686a; --twitch: #9146ff; --kick: #53fc18; --gold: #ffcb05;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; line-height: 1; color: var(--text); background: var(--card); border: 1px solid transparent; border-radius: 7px; height: 28px; padding: 0 11px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #51496a; background: var(--card2); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }

  /* Barra superior: abas das páginas à esquerda, controles da janela à direita */
  #bar { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg); }
  #brand { display: flex; align-items: center; gap: 7px; padding: 0 6px 0 2px; font-weight: 600; letter-spacing: .01em; }
  #brand img { width: 20px; height: 20px; }
  #tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 6px; flex: none; }
  .tab.on { background: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .twitch .dot, .dot.twitch { background: var(--twitch); }
  .kick .dot, .dot.kick { background: var(--kick); }
  .game .dot { background: var(--gold); }
  .act { color: var(--dim); background: transparent; border-color: var(--line); }
  #quit:hover { border-color: var(--bad); color: #fff; }

  /* Painel lateral */
  #side { position: fixed; top: 40px; right: 0; bottom: 0; width: 400px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
  #side.off { display: none; }
  #hero { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  #hero .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #hero .lv { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #hero .xp { font-size: 15px; font-weight: 600; color: var(--accent2); font-variant-numeric: tabular-nums; }
  #hero .where { display: flex; align-items: center; gap: 6px; color: var(--dim); margin-top: 2px; }
  #hero .where .dot.on { background: var(--ok); box-shadow: 0 0 0 3px #4fd18b22; }
  #hero .where .dot.off { background: var(--bad); }
  #busy, .alert { margin: 8px 14px 0; padding: 7px 10px; border-radius: 7px; background: #3a2f12; color: var(--warn); }
  #busy { display: none; }
  #busy.on { display: block; }
  .alert.bad { background: #3d1c1e; color: var(--bad); }
  #nav { display: flex; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
  #nav button { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 4px; font-size: 12.5px; border-radius: 7px 7px 0 0; background: transparent; color: var(--dim); border: 0; border-bottom: 2px solid transparent; }
  #nav button:hover:not(:disabled) { background: var(--card); color: var(--text); }
  #nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  #nav .n { margin-left: 3px; font-size: 10.5px; color: var(--faint); }
  #body { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; padding: 0 14px 18px; }
  #body::-webkit-scrollbar { width: 9px; }
  #body::-webkit-scrollbar-thumb { background: #3a3448; border-radius: 5px; border: 2px solid var(--panel); }
  .page { display: none; }
  .page.on { display: block; }
  #foot { display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

  h2 { margin: 16px 0 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; }
  .card { background: var(--card); border-radius: 9px; padding: 8px 11px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .row > :first-child { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row > :last-child { text-align: right; white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid button { height: 32px; overflow: hidden; text-overflow: ellipsis; background: var(--card); }
  .grid button.wide { grid-column: 1 / -1; }
  .primary { background: var(--accent) !important; }
  .primary:hover:not(:disabled) { background: var(--accent2) !important; }
  .mini { height: 23px; padding: 0 8px; font-size: 12px; background: var(--card2); }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .item:last-child { border-bottom: 0; }
  .item .name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 500; }
  .item .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { grid-column: 1; color: var(--dim); font-size: 12px; }
  .item .btns { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 150px; }
  .item.cur .name { color: var(--ok); }
  .empty, .note { color: var(--dim); padding: 4px 0; }
  .note { font-size: 12px; }
  .steps { counter-reset: s; display: grid; gap: 8px; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
  .step::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--card2); color: var(--dim); display: grid; place-items: center; font-size: 12px; }
  .step.done::before { content: "✓"; background: #1f3a2c; color: var(--ok); }
  .step small { display: block; color: var(--dim); }

  /* Interruptores das automações */
  .sw { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sw:last-child { border-bottom: 0; }
  .sw b { font-weight: 500; }
  .sw small { grid-column: 1; color: var(--dim); }
  .sw .track { grid-row: 1 / span 2; grid-column: 2; align-self: center; width: 36px; height: 20px; border-radius: 10px; background: #3b3549; position: relative; }
  .sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #a9a4b8; }
  .sw.on .track { background: var(--accent); }
  .sw.on .track::after { left: 18px; background: #fff; }

  /* Histórico */
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .chips button { height: 24px; padding: 0 9px; font-size: 12px; border-radius: 12px; color: var(--dim); }
  .chips button.on { background: var(--accent); color: #fff; }
  .log { color: var(--dim); padding: 4px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .log b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .log.fail, .log.has.fail { color: var(--bad); }
  .log.has { cursor: pointer; color: var(--text); }
  .log.has:hover { background: var(--card); }
  .caret { color: var(--faint); }
  .detail { margin: 5px 0 4px; padding: 7px 9px; border-left: 2px solid var(--accent); background: var(--card); border-radius: 0 7px 7px 0; cursor: text; user-select: text; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .detail > div { padding: 2px 0; }
  .detail > div:first-child { color: var(--text); }

  /* Ajustes */
  .field { display: grid; grid-template-columns: 1fr 96px; gap: 2px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field small { grid-column: 1; color: var(--dim); font-size: 12px; }
  .field input { grid-row: 1 / span 2; grid-column: 2; width: 96px; height: 28px; padding: 0 8px; text-align: right; font: inherit; font-variant-numeric: tabular-nums; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
</style>
</head>
<body>
<div id="bar">
  <div id="brand"><img src="../icon.png" alt=""><span>PokéIdle Desk</span></div>
  <div id="tabs"></div>
  <button class="act" id="reload" title="Recarregar a aba que está à vista">Recarregar aba</button>
  <button class="act" id="panel" title="Mostrar ou esconder o painel lateral">Painel</button>
  <button class="act" id="hide" title="Some com a janela (tudo continua rodando e gasta bem menos). Volte pelo ícone ao lado do relógio ou com Ctrl+Alt+P">Ocultar hub</button>
  <button class="act" id="quit" title="Fechar o app de verdade (o X da janela só oculta)">Sair</button>
</div>
<aside id="side">
  <div id="hero"></div>
  <div id="busy"></div>
  <div id="alertas"></div>
  <nav id="nav"></nav>
  <div id="body">
    <section class="page" id="p-resumo"></section>
    <section class="page" id="p-caca"></section>
    <section class="page" id="p-mercado"></section>
    <section class="page" id="p-lives"></section>
    <section class="page" id="p-auto"></section>
    <section class="page" id="p-hist"></section>
    <section class="page" id="p-ajustes"></section>
  </div>
  <div id="foot"><span id="footPerf">medindo o consumo…</span><span id="footVer"></span></div>
</aside>
<script src="ui.js"></script>
</body>
</html>
